{% extends "base.html" %}{% block title %}Enter code · Cameras{% endblock %}
{% block body %}
<div class="card narrow">
  <h1>Check your texts</h1>
  <p class="muted">We sent a 6-digit code to {{ phone }}.</p>
  {% if err %}<p class="err">{{ err }}</p>{% endif %}
  <form method="post" action="/login/code">
    <input type="hidden" name="next" value="{{ next }}">
    <input type="hidden" name="phone" value="{{ phone }}">
    <label>Code</label>
    <input name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]*" maxlength="7" autofocus required>
    <button type="submit">Sign in</button>
  </form>
  <p class="muted small"><a href="/login">Use a different number</a></p>
</div>
{% endblock %}
