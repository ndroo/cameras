{% extends "base.html" %}{% block title %}Sign in · Cameras{% endblock %}
{% block body %}
<div class="card narrow">
  <h1>Sign in</h1>
  <p class="muted">Enter your mobile number and we'll text you a code. No password.</p>
  {% if err %}<p class="err">{{ err }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Mobile number</label>
    <input name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="416 555 0123" value="{{ phone }}" autofocus required>
    <button type="submit">Text me a code</button>
  </form>
</div>
{% endblock %}
