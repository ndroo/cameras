{% extends "base.html" %}{% block title %}Sign in · Cameras{% endblock %}
{% block body %}
<div class="card narrow">
  <h1>Sign in</h1>
  <p class="muted">Enter your mobile number or email. We'll send you a code, or use your passcode if you've set one.</p>
  {% if err %}<p class="err">{{ err }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Mobile number or email</label>
    <input name="ident" type="text" inputmode="email" autocomplete="username" placeholder="416 555 0123 or you@example.com" value="{{ ident }}" autofocus required>
    <button type="submit">Send me a code</button>
    <details class="alt"><summary class="muted small">Have a passcode?</summary>
      <label>Passcode</label>
      <input name="passcode" type="password" autocomplete="current-password">
      <button type="submit" class="secondary">Sign in with passcode</button>
    </details>
  </form>
</div>
{% endblock %}
