{% extends "base.html" %}{% block title %}Multi-view · Cameras{% endblock %}
{% block body %}
<div class="wallHead">
  <h1>Multi-view</h1>
  <div class="chips" id="chips"></div>
  <div class="wallTools">
    <label class="small muted">Columns <select id="cols" class="chip"><option value="0">auto</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option></select></label>
    <button type="button" class="tool" id="fullBtn" title="Fullscreen">⛶ <span>Fullscreen</span></button>
  </div>
</div>
<div class="wall" id="wall"></div>
<p class="muted small" id="wallEmpty" hidden>Pick at least one camera above.</p>
<script id="data" type="application/json">{{ data|safe }}</script>
<script type="module" src="/static/video-stream.js"></script>
<script type="module" src="/static/wall.js"></script>
{% endblock %}
