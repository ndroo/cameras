<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}Cameras{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icon.svg">
<link rel="apple-touch-icon" href="/static/icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1115">
</head>
<body>
<header class="top">
  <span class="left">{% block back %}{% endblock %}<a href="/" class="brand"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8h13v9H3z"/><path d="M16 11l5-3v8l-5-3z"/></svg> Cameras</a></span>
  <nav>
    {% if me %}
      <a href="/wall" class="{% if request.url.path == '/wall' %}on{% endif %}">Multi-view</a>
      <a href="/events" class="{% if request.url.path == '/events' %}on{% endif %}">Events</a>
      {% if me.is_admin %}<a href="/admin" class="{% if request.url.path.startswith('/admin') %}on{% endif %}">Admin</a>{% endif %}
      <a href="/account" class="{% if request.url.path.startswith('/account') %}on{% endif %}" title="Signed in as {{ me.name }}">Account</a>
    {% endif %}
  </nav>
</header>
<main class="wrap">
{% block body %}{% endblock %}
</main>
</body>
</html>
