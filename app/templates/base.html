<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}Cameras{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css?v={{ v }}">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icon.svg">
<link rel="apple-touch-icon" href="/static/icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1115">
</head>
<body>
<div class="pbar" id="pbar"></div>
<header class="top">
  <span class="left">{% block back %}{% endblock %}<a href="/" class="brand"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8h13v9H3z"/><path d="M16 11l5-3v8l-5-3z"/></svg><span class="brandTxt">Cameras</span></a></span>
  <nav>
    {% if me %}
      <a href="/wall" class="{% if request.url.path == '/wall' %}on{% endif %}">Multi-view</a>
      <a href="/events" class="{% if request.url.path == '/events' %}on{% endif %}">Events</a>
      {% if me.is_admin %}<a href="/admin" class="{% if request.url.path.startswith('/admin') %}on{% endif %}">Admin</a>{% endif %}
      <a href="/account" class="{% if request.url.path.startswith('/account') %}on{% endif %}" title="Signed in as {{ me.name }}">Account</a>
    {% endif %}
  </nav>
</header>
<main class="wrap">
{% block body %}{% endblock %}
</main>
<script>
(function(){
  var bar = document.getElementById("pbar"), t;
  function start(){ bar.classList.add("on"); clearTimeout(t); t = setTimeout(function(){ bar.classList.remove("on"); }, 15000); }
  window.startLoading = start;
  document.addEventListener("click", function(ev){
    var a = ev.target.closest("a[href]"); if (!a || ev.defaultPrevented || ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.altKey || a.target === "_blank" || a.hasAttribute("download")) return;
    var u = new URL(a.href, location.href); if (u.origin !== location.origin || (u.pathname === location.pathname && u.search === location.search && u.hash)) return;
    if (a.dataset.nobar !== undefined) return;
    start();
  });
  document.addEventListener("submit", function(ev){
    var f = ev.target; if (ev.defaultPrevented) return; start();
    var b = ev.submitter || f.querySelector("button[type=submit],button:not([type])");
    if (b) setTimeout(function(){ b.classList.add("busy"); b.disabled = true; var l = b.dataset.busy; if (l) b.textContent = l; }, 0);
  });
  window.addEventListener("pageshow", function(){ bar.classList.remove("on"); document.querySelectorAll("button.busy").forEach(function(b){ b.classList.remove("busy"); b.disabled = false; }); });
})();
</script>
</body>
</html>
