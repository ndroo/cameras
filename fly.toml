app = "cameras-andrewmcgrath"
primary_region = "yyz"
# safety net: each live camera runs a pipe + ffmpeg (~60 MB); without swap a heating
# cycle on top of a full multi-view got the app OOM-killed, dropping every stream
swap_size_mb = 1024

[build]

[env]
  DATA_DIR = "/data"
  DB_PATH = "/data/cameras.db"
  BASE_URL = "https://cameras.andrewmcgrath.info"
  HEALTH_INTERVAL = "600"
  TZ_NAME = "America/Toronto"

[mounts]
  source = "cameras_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 200
    soft_limit = 100

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/healthz"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
